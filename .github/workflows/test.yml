name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --locked makes CI fail if uv.lock has drifted from pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run coverage run -m pytest -q

      # Fails if coverage drops below the fail_under threshold in
      # pyproject.toml.
      - name: Coverage report
        run: uv run coverage report

      - name: Lint
        run: uv run ruff check .
