[project]
name = "teknologkoren-se"
version = "2.0.0"
description = "Teknologkören's website"
readme = "README.md"
requires-python = ">=3.13, <3.14"
# Pinned to the exact versions from the pip-compiled requirements.txt
# this file replaces, so the uv migration itself changes no package
# versions. Upgrading (and relaxing these to lower bounds) is a
# separate change.
dependencies = [
    "babel==2.17.0",
    "bcrypt==4.3.0",
    "flask==3.1.1",
    "flask-babel==4.0.0",
    "flask-login==0.6.3",
    "flask-reuploaded==1.4.0",
    "flask-sqlalchemy==3.1.1",
    "flask-wtf==1.2.2",
    "markdown==3.8.2",
    "mdx-linkify==2.1",
    "phonenumbers==9.0.8",
    "python-slugify==8.0.4",
    "pytz==2025.2",
]

[tool.uv]
# Transitive dependencies pinned to the requirements.txt versions, for
# the same reason as above. Remove together with the == pins when
# upgrading.
constraint-dependencies = [
    "bleach==6.2.0",
    "blinker==1.9.0",
    "click==8.2.1",
    "greenlet==3.2.3",
    "itsdangerous==2.2.0",
    "jinja2==3.1.6",
    "markupsafe==3.0.2",
    "sqlalchemy==2.0.41",
    "text-unidecode==1.3",
    "typing-extensions==4.14.0",
    "webencodings==0.5.1",
    "werkzeug==3.1.3",
    "wtforms==3.2.1",
]

[dependency-groups]
dev = [
    "coverage",
    "pytest",
    "ruff",
]

[tool.ruff.lint]
# Deliberately minimal, same set as flasquelistan: syntax errors,
# undefined names, unused imports/variables (F), basic pycodestyle
# errors (E4/E7/E9) and bare excepts (E722). Widen once useful.
select = ["E4", "E7", "E9", "F", "E722"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "*_test.py"

[tool.coverage.run]
branch = true
source = ["teknologkoren_se"]

[tool.coverage.report]
show_missing = true
# Ratchet: bump towards the current measured coverage (minus a small
# margin) whenever new tests land. Never lower it. Measured 83% when
# introduced.
fail_under = 81
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
]
