[project]
name = "teknologkoren-se"
version = "2.0.0"
description = "Teknologkören's website"
readme = "README.md"
requires-python = ">=3.13, <3.14"
dependencies = [
    "babel>=2.17",
    "bcrypt>=4.3",
    "flask>=3.1",
    "flask-babel>=4.0",
    "flask-login>=0.6",
    # >=1.5 is a hard floor: 1.5.0 fixed a critical path traversal
    # vulnerability in UploadSet.save(name=...).
    "flask-reuploaded>=1.5",
    "flask-sqlalchemy>=3.1",
    "flask-wtf>=1.2",
    "markdown>=3.8",
    "mdx-linkify>=2.1",
    "phonenumbers>=9.0",
    "python-slugify>=8.0",
    "pytz>=2025.2",
]

[dependency-groups]
dev = [
    "coverage",
    "pytest",
    "ruff",
]

[tool.ruff.lint]
# Deliberately minimal, same set as flasquelistan: syntax errors,
# undefined names, unused imports/variables (F), basic pycodestyle
# errors (E4/E7/E9) and bare excepts (E722). Widen once useful.
select = ["E4", "E7", "E9", "F", "E722"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "*_test.py"

[tool.coverage.run]
branch = true
source = ["teknologkoren_se"]

[tool.coverage.report]
show_missing = true
# Ratchet: bump towards the current measured coverage (minus a small
# margin) whenever new tests land. Never lower it. Measured 83% when
# introduced.
fail_under = 81
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
]
