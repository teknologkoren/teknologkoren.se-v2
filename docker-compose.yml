services:
  app:
    build: .
    ports:
      # Localhost only — nginx on the host terminates TLS and proxies here.
      - "127.0.0.1:8000:8000"
    volumes:
      # Bind mounts rather than named volumes: nginx on the host serves
      # uploads and static files straight from these paths (including the
      # img<width>/ resizing locations), and backups stay a plain rsync.
      - ./instance:/app/instance
      - ./teknologkoren_se/static/uploads:/app/teknologkoren_se/static/uploads
    restart: unless-stopped
    # The image runs as UID 1000; if the mounted directories are owned by
    # another user on the host, uncomment and adjust:
    # user: "1000:1000"
    healthcheck:
      # The app sets SERVER_NAME (Flask host matching), so the probe must
      # send the real host header; adjust if the instance config differs.
      # / redirects to /sv/; urlopen follows it and raises on non-2xx.
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/', headers={'Host': 'teknologkoren.se'}))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
