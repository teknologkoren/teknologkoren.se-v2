services:
  app:
    build: .
    ports:
      # Localhost only — nginx on the host terminates TLS and proxies here.
      # The container listens on 8000 internally; published on 8001.
      - "127.0.0.1:8001:8000"
    volumes:
      # Bind mounts rather than named volumes: nginx on the host serves
      # uploads and static files straight from these paths (including the
      # img<width>/ resizing locations), and backups stay a plain rsync.
      - ./instance:/app/instance
      - ./teknologkoren_se/static/uploads:/app/teknologkoren_se/static/uploads
    restart: unless-stopped
    # The image runs as UID 1000; if the mounted directories are owned by
    # another user on the host, uncomment and adjust:
    # user: "1000:1000"
    healthcheck:
      # / redirects to /sv/; urlopen follows it and raises on non-2xx. No
      # Host header needed: the app does not host-match (host_matching is
      # off), so this loopback request is served regardless of SERVER_NAME.
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
